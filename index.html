 ['survey','📊','학생 선호도','체험은 모두 똑같이 인기 있지 않아요. 배지 공방은 눈길을 많이 끌지만, 종이비행기는 재료비가 적습니다.','인기도와 재료비를 함께 고려'],

function playSfx(freq=550,duration=.08){
 if(!soundEnabled)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
  const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime;
  osc.type='sine';osc.frequency.setValueAtTime(freq,t);osc.frequency.exponentialRampToValueAtTime(freq*.8,t+duration);
  gain.gain.setValueAtTime(.035,t);gain.gain.exponentialRampToValueAtTime(.001,t+duration);
  osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+duration+.015);

 // clouds and sunshine

 if(this.weather!=='rain'){c.fillStyle='#ffe58e';c.beginPath();c.arc(850,81,40+Math.sin(t*2)*2,0,Math.PI*2);c.fill();}if(this.weather==='rain'){c.strokeStyle='#d8eeff88';c.lineWidth=2;for(let i=0;i<52;i++){const x=(i*47+(t*130)%1100)%1000,y=(i*79+t*240)%530;c.beginPath();c.moveTo(x,y);c.lineTo(x-8,y+17);c.stroke();}}
 c.fillStyle='#76c786';c.fillRect(0,260,960,250);c.fillStyle='#c4b58f';c.beginPath();c.moveTo(-30,470);c.lineTo(330,317);c.lineTo(595,315);c.lineTo(1000,467);c.lineTo(1000,510);c.lineTo(0,510);c.closePath();c.fill();
 c.fillStyle='#f4e0a5';c.beginPath();c.moveTo(-20,476);c.lineTo(335,330);c.lineTo(590,330);c.lineTo(1000,480);c.lineTo(1000,494);c.lineTo(585,341);c.lineTo(338,343);c.lineTo(0,492);c.closePath();c.fill();
 // trees and booths as scenery
 for(const [x,y] of [[53,254],[920,249],[840,278]]){c.fillStyle='#7f5b42';c.fillRect(x-8,y,16,110);for(let j=0;j<3;j++){c.fillStyle=['#37865a','#3e9d67','#4bb178'][j];c.beginPath();c.arc(x+(j-1)*24,y+4-(j%2)*23,32,0,Math.PI*2);c.fill();}}
 // hanging flags
 c.strokeStyle='#e8e9d1';c.lineWidth=3;c.beginPath();c.moveTo(38,24);c.quadraticCurveTo(475,81,925,23);c.stroke();for(let i=0;i<19;i++){const x=46+i*47,y=28+Math.sin(i/18*Math.PI)*25;c.fillStyle=['#ff8289','#ffe58e','#92dbff','#b6a4ff'][i%4];c.beginPath();c.moveTo(x,y);c.lineTo(x+20,y+2);c.lineTo(x+12,y+31+Math.sin(t*2+i)*2);c.closePath();c.fill();}
 // two small stalls
 this.sideStand(120,228,'INFO','#9dd8fa');this.sideStand(780,240,'♻ ECO','#a8ecb7');
 // main stall with shaded roof
 c.fillStyle='#54677c';c.fillRect(345,211,292,148);c.fillStyle='#fbefcc';c.fillRect(361,226,260,116);c.fillStyle='#283e57';c.fillRect(381,258,219,60);this.roundRect(404,276,171,44,8,'#fff8de','#d9bc89');this.text(({plane:'✈️ 종이비행기',code:'🔐 암호 탈출',badge:'🎨 배지 공방'})[this.activity]||'🎪 체험 부스',488,305,19,'#304664');
 c.fillStyle='#e5b49e';c.fillRect(345,334,292,28);c.fillStyle='#b86f65';c.fillRect(346,357,290,10);c.fillStyle='#fff7dc';c.beginPath();c.moveTo(315,218);c.lineTo(666,218);c.lineTo(637,146);c.lineTo(347,146);c.closePath();c.fill();
 for(let i=0;i<10;i++){c.fillStyle=i%2?'#fff4d3':'#ff818c';c.beginPath();c.moveTo(322+i*34,218);c.lineTo(356+i*31,151);c.lineTo(356+(i+1)*31,151);c.lineTo(322+(i+1)*34,218);c.closePath();c.fill();}
 this.roundRect(388,157,202,41,12,'#253b5a');this.text('FESTIVAL 2026',489,185,20,'#f9ffd6');

class LiveShift{
 constructor(config,scene){this.config=config;this.scene=scene;this.time=0;this.done=0;this.lost=0;this.spawned=0;this.queue=[];this.energy=6;this.guides=0;this.fasts=0;this.cleaned=0;this.paused=false;this.finished=false;this.spawnAt=1.2;this.serviceAt=3;this.regenAt=12;this.last=0;this.raf=0;this.overflow=0;this.wasteNow=0;this.hiddenPaused=false;this.active=true;this.visibility=()=>{if(document.hidden&&!this.paused){this.hiddenPaused=true;this.togglePause();}};document.addEventListener('visibilitychange',this.visibility);}
 start(){this.last=performance.now();const loop=now=>{if(!this.active)return;const dt=Math.min(.12,(now-this.last)/1000);this.last=now;if(!this.paused&&!this.finished)this.tick(dt);this.raf=requestAnimationFrame(loop);};this.raf=requestAnimationFrame(loop);this.ui();}
 tick(dt){this.time+=dt;const c=this.config;const total=LIVE_SECONDS;this.spawnAt-=dt;this.serviceAt-=dt;this.regenAt-=dt;
 if(this.spawnAt<=0&&this.spawned<c.pop&&this.time<total-4){this.spawnAt= Math.max(.65, (total-8)/c.pop*(.65+Math.random()*.65));this.spawnGuest();}
 if(this.regenAt<=0){this.regenAt=11;this.energy=clamp(this.energy+1,0,6);}
 if(this.serviceAt<=0){this.serviceAt=Math.max(1.45,c.a.rate+c.b.rate);this.serveGuest();}
 if(this.queue.length>8){this.overflow+=dt;if(this.overflow>=2.2){this.overflow=0;const id=this.queue.pop();this.lost++;this.scene.leave(id,true);this.scene.sparkle('줄이 너무 길어!',390,336);}}else this.overflow=0;
 if(this.time>=total){this.finish();return;}this.ui();}
 spawnGuest(){this.scene.addGuest(this.spawned);this.queue.push(this.spawned);this.spawned++;if(this.spawned%5===0){this.message('👣 손님들이 몰려오고 있어요! 대기줄을 살펴보세요.');}}
 serveGuest(){if(!this.queue.length||this.done>=this.config.cap)return false;const id=this.queue.shift();this.scene.serve(id,true);this.done++;if(this.done%5===0)playSfx(660,.08);if(this.done%4===0)this.scene.sparkle('✨ 즐거웠어요!',550,320);return true;}
 act(n){if(this.finished||this.paused)return false;if(this.energy<n){this.message('⚡ 행동력이 부족해요. 잠깐 후 다시 회복됩니다.');return false;}this.energy-=n;return true;}
 guide(fromTap=false){if(!this.queue.length){this.message('지금은 안내할 대기 손님이 없어요.');return;}if(!this.act(1))return;this.guides++;this.overflow=0;playSfx(620,.1);this.scene.sparkle('💖 친절한 안내!',318,349);this.message('🙋 기다리는 손님을 안내했어요. 만족도에 도움이 됩니다.');this.ui();}
 fast(){if(!this.queue.length){this.message('지금 대기 중인 손님이 없어요.');return;}if(!this.act(2))return;let n=this.serveGuest()?1:0;this.fasts++;if(this.queue.length&&this.done<this.config.cap&&this.serveGuest())n++;playSfx(820,.12);this.scene.sparkle('⚡ 빠른 체험!',477,310);this.message(`⚡ ${n}명의 체험을 빠르게 도왔어요!`);this.ui();}
 clean(){const made=Math.max(0,Math.ceil(this.done/this.config.a.perWaste)-(this.config.b.id==='reuse'?3:0));if(made<=this.cleaned){this.message('🧹 지금은 치울 쓰레기가 없어요.');return;}if(!this.act(2))return;const n=Math.min(2,made-this.cleaned);this.cleaned+=n;playSfx(480,.12);this.scene.sparkle('♻️ 깨끗!',742,336);this.message(`🧹 쓰레기 ${n}칸을 치웠어요!`);this.ui();}
 message(t){const el=$('liveMsg');if(el)el.textContent=t;}
 ui(){if(!this.active)return;const val=(id,v)=>{const el=$(id);if(el)el.textContent=v;};val('left',Math.max(0,Math.ceil(LIVE_SECONDS-this.time))+'초');val('served',this.done+'명');val('queue',this.queue.length+'명');val('lost',this.lost+'명');val('energy',this.energy+' / 6');const timer=$('timerFill');if(timer)timer.style.width=(100*(1-this.time/LIVE_SECONDS))+'%';for(const [id,cost] of [['guide',1],['speed',2],['clean',2]]){const b=$(id);if(b)b.disabled=this.energy<cost||this.paused;}}
 togglePause(){if(this.finished)return;this.paused=!this.paused;this.scene.pause(this.paused);$('pause').textContent=this.paused?'▶ 다시 시작':'⏸ 일시정지';this.message(this.paused?'⏸ 잠시 멈췄어요. 다시 시작하면 남은 시간부터 진행합니다.':'▶ 축제 운영을 다시 시작했어요!');this.ui();}
 finish(){if(this.finished)return;this.finished=true;while(this.queue.length){const id=this.queue.shift();this.lost++;this.scene.leave(id,true);}if(this.spawned<this.config.pop)this.lost+=Math.max(0,Math.floor((this.config.pop-this.spawned)*.45));this.stop();finishShift(this);}
 stop(){this.active=false;cancelAnimationFrame(this.raf);document.removeEventListener('visibilitychange',this.visibility);}
}
